name: 'Benchmark Diff'
description: 'Benchmark PR performance vs main branch'
inputs:
  benchmark-dir:
    description: 'Directory containing benchmark files'
    required: false
    default: 'benchmarks/'
  runs:
    description: 'Number of timed runs per benchmark'
    required: false
    default: '10'
  warmup:
    description: 'Number of warmup runs'
    required: false
    default: '3'
  token:
    description: 'GitHub token for PR comment'
    required: false
    default: '${{ github.token }}'
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: python ${{ github.action_path }}/benchmark-diff.py --benchmark-dir ${{ inputs.benchmark-dir }} --runs ${{ inputs.runs }} --warmup ${{ inputs.warmup }} --format markdown
      shell: bash
    - uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('benchmark-results.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
